name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        name: Coverage, package build, and installed-wheel smoke
        run: |
          coverage run -m pytest
          coverage report
          python -m build
          python -m venv /tmp/trace-ml-wheel
          /tmp/trace-ml-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/trace-ml-wheel/bin/python -c "from trace_ml import verify; assert callable(verify)"
          /tmp/trace-ml-wheel/bin/trace-ml --version
